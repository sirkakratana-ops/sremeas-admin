<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="40%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#fffef0" />
      <stop offset="20%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

  <!-- Inner Aura -->
  <circle cx="50" cy="50" r="42" fill="#f59e0b" opacity="0.15" />

  <!-- Ground Furrows -->
  <path d="M 24 82 Q 50 76 76 82" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 33 88 Q 50 84 67 88" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Main Stem -->
  <path d="M 50 80 Q 49 52 50 23" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Top Crown Grain -->
  <path d="M 50 12 C 46 17, 46 23, 50 28 C 54 23, 54 17, 50 12 Z" fill="url(#goldGrad)" />

  <!-- Left Rice Grains -->
  <path d="M 48 24 C 39 22, 35 31, 41 36 C 46 35, 48 29, 48 24 Z" fill="url(#goldGrad)" />
  <path d="M 48 34 C 37 33, 33 43, 39 48 C 45 46, 48 40, 48 34 Z" fill="url(#goldGrad)" />
  <path d="M 48 45 C 36 45, 32 55, 39 60 C 45 57, 48 51, 48 45 Z" fill="url(#goldGrad)" />

  <!-- Right Rice Grains -->
  <path d="M 52 24 C 61 22, 65 31, 59 36 C 54 35, 52 29, 52 24 Z" fill="url(#goldGrad)" />
  <path d="M 52 34 C 63 33, 67 43, 61 48 C 55 46, 52 40, 52 34 Z" fill="url(#goldGrad)" />
  <path d="M 52 45 C 64 45, 68 55, 61 60 C 55 57, 52 51, 52 45 Z" fill="url(#goldGrad)" />

  <!-- Leaves -->
  <path d="M 48 64 C 27 57, 13 42, 11 27 C 24 27, 41 42, 48 57 Z" fill="url(#emeraldGrad)" />
  <path d="M 52 60 C 72 52, 87 35, 89 20 C 76 22, 60 39, 52 54 Z" fill="url(#emeraldGrad)" />

  <!-- Sparkles -->
  <circle cx="26" cy="21" r="2" fill="#fef08a" opacity="0.9" />
  <circle cx="75" cy="15" r="2.2" fill="#fef08a" opacity="0.9" />
</svg>
